[project]
name = "fastapi-todo"
version = "0.1.0"
description = ""
authors = [{ name = "kirestein", email = "erik.proenca2011@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = ["fastapi[standard] (>=0.141.1,<0.142.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
]

#? configurações do ruff, que é um linter e formatador de código Python

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

#? configurações do pytest, que é um framework de testes para Python

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

#? configurações do taskipy, que é uma ferramenta para gerenciar tarefas de desenvolvimento

[tool.taskipy.tasks]
lint = 'ruff check .'
pre_format = 'ruff check --fix .'
format = 'ruff format .'
run = 'fastapi dev fastapi_todo/app.py --port 8081 --reload'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fastapi_todo -v'
post_test = 'coverage html'
